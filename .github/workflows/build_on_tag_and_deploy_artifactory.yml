name: Build on Tag and Deploy Artifactory
on:
  push:
    tags: [ v* ]

jobs:
  build-native:
    name: Build native (${{ matrix.classifier }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            classifier: linux-x86_64
            install: |
              sudo apt-get update
              sudo apt-get install -y cmake pkg-config libwebp-dev libturbojpeg0-dev libpng-dev webp
          - os: ubuntu-24.04-arm
            classifier: linux-aarch64
            install: |
              sudo apt-get update
              sudo apt-get install -y cmake pkg-config libwebp-dev libturbojpeg0-dev libpng-dev webp
          - os: macos-latest
            classifier: macos-aarch64
            install: |
              brew install cmake pkg-config webp jpeg-turbo libpng

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Install native build dependencies
        run: ${{ matrix.install }}

      - name: Build native library
        working-directory: native
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.classifier }}
          path: native/build/libuetlib_webp_native.*
          if-no-files-found: error

  build-deploy:
    name: Build on Tag and Deploy Artifactory
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Install runtime native dependencies
        # Required so the Linux x86_64 native lib (loaded by tests during `mvn install`)
        # can resolve its libwebp / libturbojpeg / libpng dependencies.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebp7 libwebpmux3 libturbojpeg libpng16-16 webp

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts
          pattern: native-*

      - name: Stage native artifacts as classpath resources
        run: |
          set -eux
          for dir in native-artifacts/native-*; do
            classifier="${dir##*/native-}"
            mkdir -p "src/main/resources/native/${classifier}"
            cp "${dir}"/libuetlib_webp_native.* "src/main/resources/native/${classifier}/"
          done
          ls -lR src/main/resources/native

      - name: Maven prepare
        uses: UbiqueInnovation/action-systems-mvn-prepare@1f1440329f80458fcbf99214a888160840196d17 # v1.1.0
        with:
          mvn_repository_id: ubique-artifactory
          mvn_repository_user: ${{ secrets.UB_ARTIFACTORY_USER }}
          mvn_repository_password: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
          mvn_repository_url: ${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}

      - name: Maven set versions
        uses: UbiqueInnovation/action-systems-mvn-versions-set@618ca57ac89fb34e35c0f8e6a02633aa33110280 # v1.1.1
        with:
          ref_name: ${{ github.ref_name }}
          parent_pom: pom.xml

      - name: Maven install
        uses: UbiqueInnovation/action-systems-mvn-install@4cb656bce2a93be50d8109150364d38b8954c4c7 # v1.1.3
        with:
          parent_pom: pom.xml

      - name: Upload JARs
        uses: UbiqueInnovation/action-systems-mvn-package-deploy@6cf28519519e470139f0c7a6e4b54ed0af4c8fd5 # v1.0.3
        with:
          parent_pom: pom.xml
          alt_deployment_repository: ubique-artifactory::${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}

      - name: Create GitHub ${{ contains(github.ref_name, '-') == true && 'Prerelease' || 'Release' }}
        uses: UbiqueInnovation/action-systems-github-release@5db68dd4a817a585f4a0a9aa7a2cbb8b32cc4433 # v1.0.1
        with:
          ref_name: ${{ github.ref_name }}
          release_option_prerelease: ${{ contains(github.ref_name, '-') }}
          changelog_file: CHANGELOG.md
          repo_token: ${{ secrets.GITHUB_TOKEN }}
