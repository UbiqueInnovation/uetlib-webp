name: Build
on:
  push:
    branches: [ '**' ]
    tags-ignore: [ v* ]

jobs:
  native:
    name: Native (${{ matrix.classifier }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            classifier: linux-x86_64
            install: |
              sudo apt-get update
              sudo apt-get install -y cmake pkg-config libwebp-dev libturbojpeg0-dev libjpeg-dev libpng-dev webp
          - os: ubuntu-24.04-arm
            classifier: linux-aarch64
            install: |
              sudo apt-get update
              sudo apt-get install -y cmake pkg-config libwebp-dev libturbojpeg0-dev libjpeg-dev libpng-dev webp
          - os: macos-latest
            classifier: macos-aarch64
            install: |
              brew install cmake pkg-config webp jpeg-turbo libpng

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          overwrite-settings: false

      # s4u skips empty settings inputs.
      - name: Create settings.xml
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: >-
            [
              {
                "id": "ubique-artifactory-virtual",
                "username": "${{ secrets.UB_ARTIFACTORY_USER }}",
                "password": "${{ secrets.UB_ARTIFACTORY_PASSWORD }}"
              }
            ]
          repositories: >-
            [
              {
                "id": "ubique-artifactory-virtual",
                "url": "${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}"
              }
            ]

      - name: Install native build dependencies
        run: ${{ matrix.install }}

      - name: Build native library
        working-directory: native
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j

      - name: Verify on this platform
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Stage native library
        run: |
          mkdir -p native-stage/${{ matrix.classifier }}
          cp native/build/libuetlib_webp_native.* native-stage/${{ matrix.classifier }}/

      # The artifact contains <classifier>/libuetlib_webp_native.*, the packaged resource layout.
      - name: Upload native artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.classifier }}
          path: native-stage/
          if-no-files-found: error

  build:
    name: Build Project
    needs: native
    permissions:
      contents: read
    uses: UbiqueInnovation/uetlib/.github/workflows/mvn-install.yml@23b270cee4169cadc716937c31d7a14d3e69a301 # v0.2.4
    with:
      sonar: true
      native-artifacts: native-linux-x86_64 native-linux-aarch64 native-macos-aarch64
      # Runtime libraries for the Linux x86_64 native tests run by Maven.
      system-packages: libwebp7 libwebpmux3 libturbojpeg libjpeg-turbo8 libpng16-16 webp
    secrets:
      SONAR_TOKEN: ${{ secrets.UBIQUE_SONAR_TOKEN }}
      UB_ARTIFACTORY_USER: ${{ secrets.UB_ARTIFACTORY_USER }}
      UB_ARTIFACTORY_PASSWORD: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
      UB_ARTIFACTORY_URL: ${{ secrets.UB_ARTIFACTORY_URL }}
      UB_ARTIFACTORY_REPO_UBIQUE: ${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}
      SYSTEMS_UBIQUE_SIGNING_KEY_ARMOR_ASC: ${{ secrets.SYSTEMS_UBIQUE_SIGNING_KEY_ARMOR_ASC }}
      SYSTEMS_UBIQUE_SIGNING_KEY_PASSPHRASE: ${{ secrets.SYSTEMS_UBIQUE_SIGNING_KEY_PASSPHRASE }}

