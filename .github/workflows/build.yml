name: Build
on:
  push:
    branches: [ '**' ]
    tags-ignore: [ v* ]

jobs:
  build:
    name: Build (${{ matrix.classifier }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            classifier: linux-x86_64
            install: |
              sudo apt-get update
              sudo apt-get install -y cmake pkg-config libwebp-dev libturbojpeg0-dev libjpeg-dev libpng-dev webp
          - os: ubuntu-24.04-arm
            classifier: linux-aarch64
            install: |
              sudo apt-get update
              sudo apt-get install -y cmake pkg-config libwebp-dev libturbojpeg0-dev libjpeg-dev libpng-dev webp
          - os: macos-latest
            classifier: macos-aarch64
            install: |
              brew install cmake pkg-config webp jpeg-turbo libpng

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}

      - name: Install native build dependencies
        run: ${{ matrix.install }}

      - name: Build native library
        working-directory: native
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j

      - name: Stage native library as classpath resource
        run: |
          mkdir -p src/main/resources/native/${{ matrix.classifier }}
          cp native/build/libuetlib_webp_native.* src/main/resources/native/${{ matrix.classifier }}/

      - name: Prepare maven
        uses: UbiqueInnovation/action-systems-mvn-prepare@1f1440329f80458fcbf99214a888160840196d17 # v1.1.0
        with:
          mvn_repository_id: ubique-artifactory
          mvn_repository_user: ${{ secrets.UB_ARTIFACTORY_USER }}
          mvn_repository_password: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
          mvn_repository_url: ${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}

      - name: Maven Install
        id: maven_install
        uses: UbiqueInnovation/action-systems-mvn-install@1e861d926529f75b9a2e02162965f813b944ee0f # v1.3.0
        with:
          parent_pom: pom.xml

      - name: Maven Verify Sonar
        uses: UbiqueInnovation/action-systems-mvn-verify-sonar@d7b1e7a7794f1e3ca136e7f0b25640b16047d4ca # v2.0.0
        with:
          ref_name: ${{ github.ref_name }}
          parent_pom: pom.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          sonar_token: ${{ secrets.UBIQUE_SONAR_TOKEN }}
          tests_ran: ${{ steps.maven_install.outputs.tests_ran }}


      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.classifier }}
          path: src/main/resources/native/${{ matrix.classifier }}/
          if-no-files-found: error
