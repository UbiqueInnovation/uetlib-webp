name: Build
on:
  push:
    branches: [ '**' ]
    tags-ignore: [ v* ]

jobs:
  build:
    name: Build (${{ matrix.classifier }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            classifier: linux-x86_64
            install: |
              sudo apt-get update
              sudo apt-get install -y cmake pkg-config libwebp-dev libturbojpeg0-dev libjpeg-dev libpng-dev webp
          - os: ubuntu-24.04-arm
            classifier: linux-aarch64
            install: |
              sudo apt-get update
              sudo apt-get install -y cmake pkg-config libwebp-dev libturbojpeg0-dev libjpeg-dev libpng-dev webp
          - os: macos-latest
            classifier: macos-aarch64
            install: |
              brew install cmake pkg-config webp jpeg-turbo libpng

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Install native build dependencies
        run: ${{ matrix.install }}

      - name: Build native library
        working-directory: native
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j

      - name: Stage native library as classpath resource
        run: |
          mkdir -p src/main/resources/native/${{ matrix.classifier }}
          cp native/build/libuetlib_webp_native.* src/main/resources/native/${{ matrix.classifier }}/

      - name: Prepare maven
        uses: UbiqueInnovation/action-systems-mvn-prepare@bfeb86b8129a37da7d062487cc1dfb60718836cc # v2.0.0
        with:
          mvn_servers: >-
            [
              {
                "id": "ubique-artifactory-virtual",
                "username": "${{ secrets.UB_ARTIFACTORY_USER }}",
                "password": "${{ secrets.UB_ARTIFACTORY_PASSWORD }}"
              }
            ]
          mvn_repositories: >-
            [
              {
                "id": "ubique-artifactory-virtual",
                "url": "${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}"
              }
            ]

      - name: Maven Install
        id: maven_install
        uses: UbiqueInnovation/action-systems-mvn-install@1e861d926529f75b9a2e02162965f813b944ee0f # v1.3.0
        with:
          parent_pom: pom.xml

      - name: Maven Verify Sonar
        uses: UbiqueInnovation/action-systems-mvn-verify-sonar@d7b1e7a7794f1e3ca136e7f0b25640b16047d4ca # v2.0.0
        with:
          ref_name: ${{ github.ref_name }}
          parent_pom: pom.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          sonar_token: ${{ secrets.UBIQUE_SONAR_TOKEN }}
          tests_ran: ${{ steps.maven_install.outputs.tests_ran }}


      - name: Upload native artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.classifier }}
          path: src/main/resources/native/${{ matrix.classifier }}/
          if-no-files-found: error
